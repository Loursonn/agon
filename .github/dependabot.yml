version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # TypeScript 7 (réécriture en Go) n'est pas encore accepté par
      # typescript-eslint (peer < 6.1). Monter de version majeure = chantier voulu.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
