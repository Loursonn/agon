# Le projet réel, celui que `VITE_SUPABASE_URL` désigne et vers lequel le CLI
# est lié. La valeur précédente (`fthhdylcwmltxkojzsdt`) ne correspondait à
# aucun projet existant : inoffensive tant qu'on passe `--linked`, mais un
# `supabase link` lancé depuis ce fichier aurait visé le vide.
project_id = "mxbfnkkbtmbrauvqplrt"

# ---------------------------------------------------------------------------
# Edge Functions
#
# Par défaut, Supabase exige un JWT valide sur chaque fonction. C'est le bon
# réglage et il ne doit pas être desserré sans raison écrite.
# ---------------------------------------------------------------------------

[functions.provider-coros-callback]
# Appelée par le NAVIGATEUR, redirigé par COROS après autorisation. Une
# redirection HTTP ne porte pas d'en-tête `Authorization` : exiger un JWT ici
# ferait échouer tous les retours d'autorisation.
#
# Ce qui tient lieu d'authentification à la place : le paramètre `state`, une
# valeur aléatoire de 256 bits que nous seuls avons émise, conservée côté
# serveur dans `provider_oauth_states`, consommée en une seule opération SQL et
# valable dix minutes. Un appel sans `state` valide ne fait rien d'autre que
# rediriger vers l'interface.
verify_jwt = false

[functions.coach-api]
# Appelée par l'assistant IA d'un coach (curl, Claude), pas par l'app. Elle
# porte une clé `agon_…` dans `Authorization`, pas un JWT de session : le
# contrôle de Supabase la refuserait avant même que la fonction s'exécute.
#
# Ce qui tient lieu d'authentification à la place : la clé, dont seul le hash
# SHA-256 est stocké (`coach_api_keys`), vérifiée à chaque appel, révocable par
# le coach, avec une limite de débit en base. Une requête sans clé valide
# reçoit 401 avant toute lecture.
verify_jwt = false

[functions.claim-athlete]
# Appelée par l'athlète AVANT sa première connexion : il n'a pas encore de
# session, donc pas de JWT. L'autorisation tient au jeton secret du lien
# (≈ 244 bits, usage unique, stocké dans `athlete_claims`).
verify_jwt = false
